name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # Linux x64
          - ubuntu-24.04-arm    # Linux ARM
          - macos-13            # macOS x64
          - macos-latest        # macOS ARM
          - windows-latest      # Windows x64
          - windows-11-arm      # Windows ARM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: black --check .
      - run: ruff check .
      - run: mypy
      - run: bandit -r src
      - run: pytest
